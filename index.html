<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyForum- Elektron Ariza va Sorovnoma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .tab-btn.active { background: #e0e7ff; color: #4338ca; font-weight: 600; }
        .file-input { font-size: 0.75rem; }
        .badge-pulse { animation: pulse 1.8s infinite; }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
        .modal-overlay { backdrop-filter: blur(3px); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #818cf8; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col"></div>
    <div id="modalContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, remove, push, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDafsnHRJpk5cM9eXvTWfwuQy1QOgBJ0TA",
            authDomain: "ilovalarim-944d0.firebaseapp.com",
            databaseURL: "https://ilovalarim-944d0-default-rtdb.firebaseio.com",
            projectId: "ilovalarim-944d0",
            storageBucket: "ilovalarim-944d0.firebasestorage.app",
            messagingSenderId: "120782588271",
            appId: "1:120782588271:web:161269f048b218c52bc09a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const CACHE = { user: null, arizaTurlari: null, arizalar: null, yangiliklar: null, holatlar: null, users: null, xabarlar: null, sorovnomalar: null, sorovnomaTurlari: null, adminRuxsatlar: null };
        let profiles = JSON.parse(localStorage.getItem('app_profiles')) || [];
        let currentProfileId = localStorage.getItem('current_profile_id') || null;
        let readItems = JSON.parse(localStorage.getItem('app_read_items')) || [];

        function markAsRead(itemId) {
            if (!readItems.includes(itemId)) { readItems.push(itemId); localStorage.setItem('app_read_items', JSON.stringify(readItems)); updateBadges(); }
        }

        // ------------------ AUTH / PIN ------------------
        async function initSystem() {
            const usersSnap = await get(ref(db, 'users'));
            if (!usersSnap.exists()) {
                const newId = Math.floor(100000 + Math.random() * 900000).toString();
                await set(ref(db, `users/${newId}`), { id: newId, pin: "1234", role: 'admin', status: 'offline', lastSeen: new Date().toISOString(), blocked: false });
                profiles = [{ id: newId, pin: "1234", role: 'admin' }];
                localStorage.setItem('app_profiles', JSON.stringify(profiles));
                currentProfileId = newId; localStorage.setItem('current_profile_id', currentProfileId);
            } else if (profiles.length === 0) {
                const users = usersSnap.val(); const firstId = Object.keys(users)[0];
                profiles.push(users[firstId]); localStorage.setItem('app_profiles', JSON.stringify(profiles));
                currentProfileId = firstId; localStorage.setItem('current_profile_id', currentProfileId);
            }
            if (currentProfileId) {
                const check = await get(ref(db, `users/${currentProfileId}`));
                if (!check.exists()) { profiles = profiles.filter(p => p.id !== currentProfileId); localStorage.setItem('app_profiles', JSON.stringify(profiles)); currentProfileId = profiles.length ? profiles[0].id : null; localStorage.setItem('current_profile_id', currentProfileId || ''); }
            }
            const active = profiles.find(p => p.id === currentProfileId);
            if (!active && profiles.length) { currentProfileId = profiles[0].id; localStorage.setItem('current_profile_id', currentProfileId); }
            renderAuthOrDashboard();
        }

        function setupPresence(userId) {
            if (!userId) return;
            const refUser = ref(db, `users/${userId}`);
            update(refUser, { status: 'online', lastSeen: new Date().toISOString() });
            onDisconnect(refUser).update({ status: 'offline', lastSeen: new Date().toISOString() });
        }

        async function getCurrentUser(force = false) {
            if (!currentProfileId) return null;
            if (!force && CACHE.user && CACHE.user.id === currentProfileId) return CACHE.user;
            const snap = await get(ref(db, `users/${currentProfileId}`));
            if (snap.exists()) { CACHE.user = snap.val(); return CACHE.user; }
            return null;
        }

        // ---------- ADMIN RUXSATLARI ----------
        const ADMIN_PERM_LIST = [
            'arizalar', 'sorovnomalar', 'turlar', 'sorovnoma_turlar', 'statistika',
            'holatlar', 'users', 'ruxsatlar', 'yangilik', 'xabarlar', 'texnik',
            'admin_ruxsatlar' // o'zini o'zi boshqarish
        ];

        async function getAdminRuxsatlar(force = false) {
            if (!force && CACHE.adminRuxsatlar) return CACHE.adminRuxsatlar;
            const snap = await get(ref(db, 'adminRuxsatlar'));
            CACHE.adminRuxsatlar = snap.exists() ? snap.val() : {};
            return CACHE.adminRuxsatlar;
        }

        async function hasAdminPerm(permKey) {
            const user = await getCurrentUser();
            if (!user || user.role !== 'admin') return false;
            // Agar permKey 'admin_ruxsatlar' bo'lsa, uni maxsus ruxsat sifatida tekshiramiz
            // Asosiy admin (birinchi admin) yoki ruxsat berilgan bo'lsa
            const ruxsatlar = await getAdminRuxsatlar(true);
            const userPerms = ruxsatlar[user.id] || {};
            // Default: agar ruxsatlar mavjud bo'lmasa, barcha ruxsatlar true (eski versiya)
            if (Object.keys(userPerms).length === 0) {
                // Agar umuman ruxsat yozuvi bo'lmasa, hamma ruxsat bor deb hisoblaymiz
                return true;
            }
            return userPerms[permKey] === true;
        }

        async function setAdminPerm(userId, permKey, value) {
            await update(ref(db, `adminRuxsatlar/${userId}`), { [permKey]: value });
            CACHE.adminRuxsatlar = null;
        }

        // ------------------ RENDER AUTH / DASHBOARD ------------------
        async function renderAuthOrDashboard() {
            const appDiv = document.getElementById('app');
            const user = await getCurrentUser(true);
            if (!user) { appDiv.innerHTML = `<div class="p-8 text-center text-red-500 font-bold">Profil topilmadi!</div>`; return; }
            if (user.blocked) { appDiv.innerHTML = `<div class="p-8 text-center text-red-600 font-bold text-xl">ID ${user.id} bloklangan!</div>`; return; }
            if (!sessionStorage.getItem(`auth_${user.id}`)) { renderPinPrompt(appDiv, user); return; }
            setupPresence(user.id);
            renderMainDashboard(appDiv, user);
        }

        function renderPinPrompt(container, user) {
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-purple-50">
                    <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-indigo-100 text-center space-y-6">
                        <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-lg"><i class="fa-solid fa-shield-halved"></i></div>
                        <div><h1 class="text-2xl font-extrabold text-gray-800">Kirish</h1><p class="text-sm text-gray-500 mt-1">ID: <span class="font-bold text-indigo-600">${user.id}</span> · ${user.role.toUpperCase()}</p></div>
                        <div class="space-y-4">
                            <input type="password" id="pinInput" placeholder="Himoya paroli" class="w-full px-5 py-3.5 border-2 border-indigo-200 rounded-2xl text-center text-xl tracking-widest font-bold focus:ring-4 focus:ring-indigo-300 focus:outline-none bg-white/70">
                            <button id="verifyPinBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-2xl font-bold shadow-lg hover:shadow-xl transition"><i class="fa-regular fa-circle-check mr-2"></i> Kirish</button>
                        </div>
                        <div class="pt-2"><button id="adminLoginBtn" class="w-full bg-gradient-to-r from-purple-700 to-pink-600 text-white py-2.5 rounded-2xl font-semibold text-sm shadow hover:shadow-lg transition"><i class="fa-solid fa-crown mr-2"></i> Admin sifatida kirish</button></div>
                        <div class="pt-4 border-t flex flex-wrap justify-between items-center text-xs text-gray-500 gap-2">
                            <select id="quickProfileSwitch" class="border-2 border-indigo-200 px-3 py-1.5 rounded-xl font-medium bg-white/70 text-indigo-700">${profiles.map(p => `<option value="${p.id}" ${p.id === user.id ? 'selected' : ''}>ID: ${p.id} (${p.role})</option>`).join('')}</select>
                            <button id="loginWithExistingIdBtn" class="border-2 border-purple-500 text-purple-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-purple-50"><i class="fa-regular fa-id-card mr-1"></i> ID kirit</button>
                            <button id="createProfileFromPinBtn" class="border-2 border-indigo-500 text-indigo-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-50"><i class="fa-solid fa-user-plus mr-1"></i> Yangi ID</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('verifyPinBtn').addEventListener('click', async () => {
                const pin = document.getElementById('pinInput').value.trim();
                const snap = await get(ref(db, `users/${user.id}`)); const dbUser = snap.exists() ? snap.val() : user;
                if (dbUser.blocked) { alert("ID bloklangan!"); return; }
                if (pin === (dbUser.pin || "1234")) { sessionStorage.setItem(`auth_${user.id}`, "true"); renderAuthOrDashboard(); }
                else alert("Noto'g'ri parol!");
            });
            document.getElementById('adminLoginBtn').addEventListener('click', async () => {
                const p = prompt("Admin paroli:"); if (p === "900") { await update(ref(db, `users/${user.id}`), { role: 'admin' }); sessionStorage.setItem(`auth_${user.id}`, "true"); sessionStorage.setItem(`admin_verified_${user.id}`, "true"); CACHE.user = null; renderAuthOrDashboard(); } else alert("Xato");
            });
            document.getElementById('loginWithExistingIdBtn').addEventListener('click', async () => {
                const id = prompt("ID:"); if (!id) return; const snap = await get(ref(db, `users/${id.trim()}`)); if (!snap.exists()) { alert("Yo'q"); return; }
                const data = snap.val(); if (data.blocked) { alert("Bloklangan"); return; }
                const pin = prompt(`ID ${id} parol:`); if (pin === null) return;
                if (pin.trim() === (data.pin || "1234")) { if (!profiles.some(p => p.id === data.id)) { profiles.push(data); localStorage.setItem('app_profiles', JSON.stringify(profiles)); } currentProfileId = data.id; localStorage.setItem('current_profile_id', currentProfileId); sessionStorage.setItem(`auth_${data.id}`, "true"); CACHE.user = null; renderAuthOrDashboard(); } else alert("Parol xato");
            });
            document.getElementById('quickProfileSwitch').addEventListener('change', (e) => { currentProfileId = e.target.value; localStorage.setItem('current_profile_id', currentProfileId); CACHE.user = null; renderAuthOrDashboard(); });
            document.getElementById('createProfileFromPinBtn').addEventListener('click', async () => {
                let newId; let exists = true; while (exists) { newId = Math.floor(100000 + Math.random() * 900000).toString(); const s = await get(ref(db, `users/${newId}`)); exists = s.exists(); }
                const p = { id: newId, pin: "1234", role: 'odam', status: 'offline', lastSeen: new Date().toISOString(), blocked: false };
                await set(ref(db, `users/${newId}`), p); if (!profiles.some(x => x.id === newId)) { profiles.push(p); localStorage.setItem('app_profiles', JSON.stringify(profiles)); }
                currentProfileId = newId; localStorage.setItem('current_profile_id', currentProfileId); CACHE.user = null; renderAuthOrDashboard();
            });
        }

        // ------------------ DASHBOARD ------------------
        async function renderMainDashboard(container, user) {
            const isAdmin = user.role === 'admin';
            const permSnap = await get(ref(db, `ruxsatlar/${user.id}`));
            const perms = permSnap.exists() ? permSnap.val() : {};
            const hasPerm = (key) => { if (isAdmin) return true; if (key.startsWith('admin_')) return false; return perms[key] !== false; };
            // Admin ruxsatlari
            const hasAdmin = async (key) => { if (!isAdmin) return false; return await hasAdminPerm(key); };

            // Menyu elementlari
            const menuItems = [];

            // Oddiy foydalanuvchi menyulari
            if (hasPerm('ariza')) menuItems.push({ id: 'ariza', label: 'Ariza', icon: 'fa-regular fa-file-lines text-indigo-500', badge: false });
            if (hasPerm('arizalarim')) menuItems.push({ id: 'arizalarim', label: 'Arizalarim', icon: 'fa-regular fa-folder-open text-indigo-500', badge: false });
            if (hasPerm('sorovnoma')) menuItems.push({ id: 'sorovnoma', label: 'So‘rovnoma', icon: 'fa-regular fa-rectangle-list text-emerald-500', badge: false });
            if (hasPerm('sorovnomalarim')) menuItems.push({ id: 'sorovnomalarim', label: 'So‘rovnomalarim', icon: 'fa-regular fa-copy text-emerald-500', badge: false });
            if (hasPerm('yangiliklar')) menuItems.push({ id: 'yangiliklar', label: 'Yangiliklar', icon: 'fa-regular fa-newspaper text-indigo-500', badge: 'yangiliklar' });
            if (hasPerm('xabarlar')) menuItems.push({ id: 'xabarlar', label: 'Xabarlar', icon: 'fa-regular fa-message text-indigo-500', badge: 'xabarlar' });
            if (hasPerm('profillarim')) menuItems.push({ id: 'profillarim', label: 'Profillarim', icon: 'fa-regular fa-users text-indigo-500', badge: false });

            // Admin menyulari (faqat admin va ruxsat bo'lsa)
            if (isAdmin) {
                const adminMenuItems = [
                    { id: 'admin_arizalar', label: 'Arizalar', icon: 'fa-regular fa-shield text-purple-500', perm: 'arizalar' },
                    { id: 'admin_sorovnomalar', label: 'So‘rovnomalar', icon: 'fa-regular fa-rectangle-list text-emerald-500', perm: 'sorovnomalar' },
                    { id: 'admin_turlar', label: 'Ariza turlari', icon: 'fa-regular fa-gear text-purple-500', perm: 'turlar' },
                    { id: 'admin_sorovnoma_turlar', label: 'So‘rovnoma turlari', icon: 'fa-regular fa-list-check text-emerald-500', perm: 'sorovnoma_turlar' },
                    { id: 'admin_statistika', label: 'Statistika', icon: 'fa-regular fa-chart-pie text-purple-500', perm: 'statistika' },
                    { id: 'admin_holatlar', label: 'Holatlar', icon: 'fa-regular fa-palette text-purple-500', perm: 'holatlar' },
                    { id: 'admin_users', label: 'Foydalanuvchilar', icon: 'fa-regular fa-users-gear text-purple-500', perm: 'users' },
                    { id: 'admin_ruxsatlar', label: 'Ruxsatlar', icon: 'fa-regular fa-user-lock text-purple-500', perm: 'ruxsatlar' },
                    { id: 'admin_yangilik', label: 'Yangiliklar', icon: 'fa-regular fa-bullhorn text-purple-500', perm: 'yangilik' },
                    { id: 'admin_xabarlar', label: 'Xabarlar', icon: 'fa-regular fa-comments text-purple-500', perm: 'xabarlar' },
                    { id: 'admin_texnik', label: 'Texnik ishlar', icon: 'fa-regular fa-wrench text-purple-500', perm: 'texnik' },
                    { id: 'admin_privileges', label: 'Admin ruxsatlari', icon: 'fa-regular fa-shield-halved text-purple-500', perm: 'admin_ruxsatlar' }
                ];
                for (let item of adminMenuItems) {
                    const allowed = await hasAdmin(item.perm);
                    if (allowed) {
                        menuItems.push({ id: item.id, label: item.label, icon: item.icon, badge: false, admin: true });
                    }
                }
            }

            // Badge funksiyasi
            const badgeHtml = (id) => id ? `<span id="badge_${id}" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold hidden">0</span>` : '';

            let menuHtml = menuItems.map(item => `
                <button onclick="switchTab('${item.id}')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center justify-between tab-btn" data-tab="${item.id}">
                    <span><i class="${item.icon} mr-3"></i>${item.label}</span>
                    ${item.badge ? badgeHtml(item.badge) : ''}
                </button>
            `).join('');

            container.innerHTML = `
                <header class="bg-white/80 backdrop-blur-md border-b border-indigo-100 shadow-sm sticky top-0 z-50">
                    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <span class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold px-4 py-1.5 rounded-2xl text-sm shadow">ID: ${user.id}</span>
                            <span class="text-xs uppercase font-bold px-3 py-1 rounded-full ${isAdmin ? 'bg-purple-200 text-purple-800' : 'bg-blue-200 text-blue-800'}">${user.role}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${isAdmin ? `<button onclick="openAdminGate()" class="text-xs bg-purple-600 text-white font-bold px-4 py-2 rounded-2xl shadow hover:bg-purple-700 transition"><i class="fa-solid fa-shield-halved mr-1"></i> Admin</button>` : ''}
                            <button onclick="logoutUser('${user.id}')" class="text-xs bg-red-50 text-red-600 font-bold px-4 py-2 rounded-2xl hover:bg-red-100 transition"><i class="fa-regular fa-right-from-bracket mr-1"></i> Chiqish</button>
                        </div>
                    </div>
                </header>
                <div class="max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 flex-1">
                    <div class="lg:col-span-1 space-y-2">
                        <div class="bg-white/70 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-indigo-100 space-y-1">
                            <div class="text-xs font-bold text-gray-400 px-3 uppercase tracking-wider mb-1">Menyular</div>
                            ${menuHtml}
                        </div>
                    </div>
                    <div id="tabContent" class="lg:col-span-3"></div>
                </div>
            `;
            updateBadges();
            const first = document.querySelector('.tab-btn');
            if (first) { const t = first.dataset.tab; if (t.startsWith('admin_')) window.checkAdminPasswordAndSwitch(t); else window.switchTab(t); }
            else document.getElementById('tabContent').innerHTML = `<div class="bg-white/70 p-6 rounded-3xl shadow-sm border text-center text-gray-400 font-semibold">Hech qanday funksiya yo‘q</div>`;
        }

        // ------------------ BADGES ------------------
        async function updateBadges() {
            const user = await getCurrentUser(); if (!user) return;
            const xData = await getXabarlarCached(true); let unreadX = 0;
            for (let bKey in xData) { const b = xData[bKey]; const list = b.xabarlar || {}; for (let xKey in list) { const x = list[xKey]; if ((!x.targetId || x.targetId === user.id) && !readItems.includes(xKey)) unreadX++; } }
            const xBadge = document.getElementById('badge_xabarlar'); if (xBadge) { if (unreadX > 0) { xBadge.innerText = unreadX; xBadge.classList.remove('hidden'); } else xBadge.classList.add('hidden'); }
            const yData = await getYangiliklarCached(true); let unreadY = 0; for (let yKey in yData) { if (!readItems.includes(yKey)) unreadY++; }
            const yBadge = document.getElementById('badge_yangiliklar'); if (yBadge) { if (unreadY > 0) { yBadge.innerText = unreadY; yBadge.classList.remove('hidden'); } else yBadge.classList.add('hidden'); }
        }

        window.logoutUser = async function(id) { await update(ref(db, `users/${id}`), { status: 'offline', lastSeen: new Date().toISOString() }); sessionStorage.removeItem(`auth_${id}`); sessionStorage.removeItem(`admin_verified_${id}`); CACHE.user = null; initSystem(); };
        window.openAdminGate = async function() { const user = await getCurrentUser(); if (!user || user.role !== 'admin') return; sessionStorage.removeItem(`admin_verified_${user.id}`); window.checkAdminPasswordAndSwitch('admin_arizalar'); };
        window.checkAdminPasswordAndSwitch = async function(tab) {
            const user = await getCurrentUser(); if (!user || user.role !== 'admin') { alert("Huquq yo‘q!"); return; }
            if (sessionStorage.getItem(`admin_verified_${user.id}`) === "true") { window.switchTab(tab); return; }
            const p = prompt("Admin paroli:"); if (p === "900") { sessionStorage.setItem(`admin_verified_${user.id}`, "true"); window.switchTab(tab); } else alert("Xato");
        };

        function showLoading(content) { content.innerHTML = `<div class="bg-white/70 p-12 rounded-3xl shadow-sm border text-center"><div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div><p class="text-sm text-gray-500 mt-3">Yuklanmoqda...</p></div>`; }

        window.switchTab = async function(tab) {
            const user = await getCurrentUser(); if (!user) return;
            if (tab.startsWith('admin_') && user.role !== 'admin') return;
            document.querySelectorAll('.tab-btn').forEach(b => { if (b.dataset.tab === tab) b.classList.add('active'); else b.classList.remove('active'); });
            const content = document.getElementById('tabContent'); showLoading(content);
            setTimeout(() => {
                if (tab === 'ariza') renderArizaForm(content);
                else if (tab === 'arizalarim') renderArizalarim(content);
                else if (tab === 'sorovnoma') renderSorovnomaForm(content);
                else if (tab === 'sorovnomalarim') renderSorovnomalarim(content);
                else if (tab === 'yangiliklar') renderYangiliklarUser(content);
                else if (tab === 'xabarlar') renderXabarlarUser(content);
                else if (tab === 'profillarim') renderProfillarim(content);
                else if (tab === 'admin_arizalar') renderAdminArizalar(content);
                else if (tab === 'admin_sorovnomalar') renderAdminSorovnomalar(content);
                else if (tab === 'admin_turlar') renderAdminTurlar(content);
                else if (tab === 'admin_sorovnoma_turlar') renderAdminSorovnomaTurlar(content);
                else if (tab === 'admin_statistika') renderAdminStatistika(content);
                else if (tab === 'admin_holatlar') renderAdminHolatlar(content);
                else if (tab === 'admin_users') renderAdminUsers(content);
                else if (tab === 'admin_ruxsatlar') renderAdminRuxsatlar(content);
                else if (tab === 'admin_yangilik') renderAdminYangilikManagement(content);
                else if (tab === 'admin_xabarlar') renderAdminXabarlarManagement(content);
                else if (tab === 'admin_texnik') renderAdminTexnik(content);
                else if (tab === 'admin_privileges') renderAdminPrivileges(content);
                else content.innerHTML = `<div class="bg-white/70 p-6 rounded-3xl shadow-sm border text-center text-gray-400">Bo'lim tayyorlanmoqda</div>`;
            }, 10);
        };

        // ------------------ PROFILLAR ------------------
        async function renderProfillarim(container) {
            const user = await getCurrentUser();
            let html = `<div class="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-indigo-100 space-y-6"><div class="flex justify-between"><div><h2 class="text-2xl font-bold text-gray-800">Profillarim</h2><p class="text-sm text-gray-500">Saqlangan profillar</p></div><button id="addNewProfileBtn" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-5 py-2.5 rounded-2xl font-bold shadow hover:shadow-lg transition"><i class="fa-solid fa-user-plus mr-2"></i>Yangi ID</button></div><div class="space-y-3">`;

            container.innerHTML = `

                async function readFile(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }

                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 modal-overlay">
                    <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-md space-y-4 border border-purple-100">
                        <div class="flex justify-between items-center border-b pb-3"><h3 class="text-xl font-bold">Ruxsat qo'shish</h3><button onclick="closeModal()" class="text-2xl font-bold">&times;</button></div>
                        <div><label class="text-xs font-medium">Ruxsat turi</label>
                            <select id="newAdminPermSelect" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl bg-white">
                                ${availablePerms.map(p => `<option value="${p}">${p}</option>`).join('')}
                            </select>
                        </div>
                        <div class="flex justify-end gap-2 pt-3 border-t"><button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 rounded-2xl font-bold text-sm">Bekor</button><button onclick="saveAddAdminPerm('${userId}')" class="px-6 py-2.5 bg-purple-600 text-white rounded-2xl font-bold text-sm shadow">Qo'shish</button></div>
                    </div>
                </div>
            `;
        };
        window.saveAddAdminPerm = async function(userId) {
            const permKey = document.getElementById('newAdminPermSelect').value;
            await setAdminPerm(userId, permKey, true);
            closeModal();
            renderAdminPrivileges(document.getElementById('tabContent'));
        };
        window.removeAdminPerm = async function(userId, permKey) {
            if (!confirm(`"${permKey}" ruxsatini olib tashlash?`)) return;
            await setAdminPerm(userId, permKey, false);
            renderAdminPrivileges(document.getElementById('tabContent'));
        };

        // ------------------ INIT ------------------
        initSystem();
    </script>
</body>
</html>
